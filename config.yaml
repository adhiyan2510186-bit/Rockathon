# config.yaml — Stage 2 (weights) and Stage 5 (authorisation) source of truth.
#
# Nothing in this file is ever passed to the LLM as instruction text. Stage 1/2
# extraction only reads user language to fill in *which* fields were stated and
# *what* they were stated as; every number that actually gates or scores a
# purchase is read from here by plain Python. See CLAUDE.md, "THE ONE RULE".

# ---------------------------------------------------------------------------
# Stage 5 — authorisation limit
# ---------------------------------------------------------------------------
# Total order value the agent may commit to WITHOUT a human approval.
# Exceeding this escalates (trigger #2) — it never causes a silent rejection
# and never causes a silent purchase above the line.
authorisation_limit_inr: 105000

# ---------------------------------------------------------------------------
# Stage 5 — substitution threshold
# ---------------------------------------------------------------------------
# If the #1 ranked product becomes unavailable at confirmation or payment
# (trigger #3), the agent may silently fall back to #2 ONLY if #1 led #2 by
# this many points or fewer. A wider gap means #2 is a meaningfully worse
# fit, so the agent escalates instead of swapping silently.
substitution_threshold_points: 5

# ---------------------------------------------------------------------------
# Categories — everything the agent knows about a kind of purchase
# ---------------------------------------------------------------------------
# ONE BLOCK PER CATEGORY. This is the whole implementation of a category: there
# is no matching `if category == "packaging"` anywhere in agent/. Adding
# furniture meant adding a block here and rows to a catalog; it meant no new
# code path, no new branch, and no change to ranking, authorisation or audit.
# tests/test_category_is_data.py enforces that by failing if any category name
# appears as a literal in agent/*.py outside this file's reader.
#
# Each block carries:
#   unit_noun        what one of these is called on screen ("12 chairs", not
#                    "12 units"). Display only — never used in a decision.
#   keywords         Stage 1. The model may answer "kraft mailer boxes"; Python
#                    maps that onto "packaging" so the lookups below cannot
#                    miss. Matched as substrings against the brief, first
#                    category to match wins. A keyword may not appear under two
#                    categories — agent/config.py raises at startup if one does,
#                    because a silent mis-route is invisible on stage.
#   per_unit_cap_inr Stage 3 HARD constraint, used ONLY if the brief states no
#                    cap of its own. When this default is used, stage 1 logs the
#                    field as ASSUMED rather than CONFIRMED — the audit trail
#                    must never present our guess as the user's instruction.
#   default_weights  Stage 2, used when the user states no priority. Must sum to
#                    1.0 (validated). See weight_rounding_step below for how a
#                    stated priority rescales these.
#   spec_words       Stage 1 offline parser only. The vocabulary it will pull out
#                    of a sentence as a physical requirement. Kept per-category
#                    so "recycled" in a packaging brief does not become a hard
#                    spec gate on a chair.
#   spec_synonyms    Stage 3. Trade shorthand, so one product is one product:
#                    the aggregator writes "DW", the user writes "double-wall",
#                    the parser sometimes returns "double wall".
#
# OPTIONAL, and only for categories where the same product suits different jobs:
#   context_question ONE question, asked at stage 2 and only when the user
#                    stated no priority of their own. Their words always win —
#                    a menu that could override "reliability matters a lot"
#                    would be us replacing what they said with our taxonomy.
#   contexts         tag -> {label, note, weights}. Each weight set is a
#                    complete replacement for default_weights and obeys the same
#                    rule: exactly the four soft criteria, summing to 1.0,
#                    validated at startup by agent/config.py.
#
# A CONTEXT CHANGES WEIGHTS AND NOTHING ELSE. It cannot add a spec, move a price
# cap, or touch the authorisation limit. Those decide who QUALIFIES; a context is
# a statement about what the buyer prefers among the ones that already do. The
# same split as everywhere else in this file: eligibility is not preference.
#
# Note also what a context CANNOT weight. "Mic quality" and "comfort" are specs,
# not criteria — the four soft criteria are the universal commercial questions
# and are deliberately not configurable (see the note below). So "these are for
# all-day calls" moves reliability and the replacement window up and price down;
# it does not invent a fifth scoring column.
#
# Packaging and laptops have no contexts on purpose. A box is a box, and a laptop
# brief already carries its own spec list. Contexts are opt-in data, not a
# feature every category has to grow.
#
# The four SOFT criteria (reliability, price, replacement, delivery) are the
# same in every category and are deliberately NOT configurable. They are the
# universal commercial questions — a replacement window IS a warranty on a chair
# or a laptop. Specs are what differ between categories; buying criteria are not.
categories:

  packaging:
    unit_noun: boxes
    keywords: [box, boxes, mailer, carton, packag, void fill, tape, bubble, corrugat]
    per_unit_cap_inr: 25          # mailer boxes, void fill, printed cartons
    default_weights:
      reliability: 0.25
      price: 0.30
      replacement: 0.25
      delivery: 0.20
    spec_words: [double-wall, double wall, single-wall, single wall, corrugated,
                 kraft, waterproof, food-grade, food grade, matte, glossy,
                 recycled, printed, unprinted]
    spec_synonyms: {dw: doublewall, sw: singlewall}

  # Deliberately an orphan: we hold opinions about labels and no vendor stocks a
  # single one. That gap is the reason discovery.available_categories() reads
  # what we can actually buy from the CATALOGS rather than from this file. The
  # agent tells a user what it can really source, not what it has defaults for.
  labels:
    unit_noun: labels
    keywords: [label, sticker, tag, decal]
    per_unit_cap_inr: 3
    default_weights:
      reliability: 0.20
      price: 0.35
      replacement: 0.20
      delivery: 0.25
    spec_words: [matte, glossy, waterproof, printed, unprinted]
    spec_synonyms: {}

  furniture:
    unit_noun: chairs
    keywords: [chair, chairs, desk, desks, table, stool, furniture, cabinet]
    per_unit_cap_inr: 9000
    # Reliability and the replacement window lead here: a chair is used daily
    # for years by a named person, and replacing a bad one costs more than the
    # price gap between a good one and a cheap one.
    default_weights:
      reliability: 0.30
      price: 0.25
      replacement: 0.25
      delivery: 0.20
    spec_words: [mesh back, adjustable height, fixed height, lumbar support,
                 fabric, leather, wheeled, stackable]
    spec_synonyms: {}
    context_question: Who will be sitting in these day to day?
    contexts:
      all_day_desk:
        label: Assigned desks, used all day
        note: One named person, eight hours a day, for years.
        weights: {reliability: 0.35, price: 0.20, replacement: 0.30, delivery: 0.15}
      meeting_rooms:
        label: Meeting and breakout rooms
        note: Occasional use by whoever is in the room.
        weights: {reliability: 0.25, price: 0.35, replacement: 0.20, delivery: 0.20}
      new_office:
        label: Fitting out a new office
        note: There is a date the floor has to be usable.
        weights: {reliability: 0.25, price: 0.25, replacement: 0.15, delivery: 0.35}

  laptops:
    unit_noun: laptops
    keywords: [laptop, laptops, macbook, ultrabook, notebook computer]
    per_unit_cap_inr: 70000
    # "workstation" is deliberately absent from the keywords above: it is a desk
    # and it is a computer, so it belongs to neither list. The startup collision
    # check in agent/config.py is what stops someone adding it to both.
    default_weights:
      reliability: 0.35
      price: 0.25
      replacement: 0.25
      delivery: 0.15
    spec_words: [8gb ram, 16gb ram, 32gb ram, 256gb ssd, 512gb ssd, 1tb ssd,
                 backlit keyboard, touchscreen]
    spec_synonyms: {i5: intelcorei5, i7: intelcorei7}
    # Same case for asking as headphones, and a sharper one. "8 laptops, 16GB,
    # under Rs 65,000" is a complete brief that still does not say whether these
    # sit on a desk or go in a bag — and on our own catalog that answer flips the
    # recommendation: say they travel and the machine with the 45-day replacement
    # window wins over the one that is faster to arrive and better rated.
    context_question: Where will these laptops spend their life?
    contexts:
      dev_build:
        label: Development and builds
        note: A slow or dead machine costs engineering days.
        weights: {reliability: 0.40, price: 0.15, replacement: 0.30, delivery: 0.15}
      field_sales:
        label: Out on the road
        note: They get dropped, and a spare is not on the next desk.
        weights: {reliability: 0.30, price: 0.20, replacement: 0.35, delivery: 0.15}
      loaner_pool:
        label: Shared loaner bench
        note: Spares, handed out and handed back.
        weights: {reliability: 0.20, price: 0.40, replacement: 0.25, delivery: 0.15}

  headphones:
    unit_noun: headsets
    keywords: [headphone, headphones, headset, headsets, earbud, earbuds,
               earphone, earphones]
    per_unit_cap_inr: 5000
    # Reliability leads for the same reason it does on a chair: this is a thing a
    # named person wears all day, and the cheap end of this market fails inside a
    # month. Delivery is the least of it — nobody's launch slips because the
    # headsets came a week late.
    default_weights:
      reliability: 0.35
      price: 0.25
      replacement: 0.25
      delivery: 0.15
    spec_words: [over-ear, over ear, on-ear, on ear, in-ear, in ear,
                 wireless, wired, noise-cancelling, noise cancelling,
                 bluetooth, foldable]
    # "ANC" is this category's "DW": the marketplace spec sheet writes the trade
    # shorthand and the buyer writes the words. One product, one spelling.
    spec_synonyms: {anc: noisecancelling}
    # The clearest case for asking. "40 headsets" is a complete, buyable brief
    # and it still does not say whether a dead one costs a sales call or an
    # afternoon of background music. Those are different purchases.
    context_question: What will these mainly be used for?
    contexts:
      office_calls:
        label: All-day calls at a desk
        note: A headset that dies is a person off the phone.
        weights: {reliability: 0.40, price: 0.15, replacement: 0.30, delivery: 0.15}
      new_starters:
        label: Kitting out new joiners
        note: They start on a date, so late is a real cost.
        weights: {reliability: 0.30, price: 0.20, replacement: 0.15, delivery: 0.35}
      shared_pool:
        label: Shared pool, handed around
        note: They get lost and broken; we expect to rebuy.
        weights: {reliability: 0.20, price: 0.40, replacement: 0.30, delivery: 0.10}

  # Fallback for any category without a block of its own. Even weights, because
  # with nothing known about the purchase we have no honest reason to prefer one
  # criterion over another.
  default:
    unit_noun: units
    keywords: []
    per_unit_cap_inr: 50
    default_weights:
      reliability: 0.25
      price: 0.25
      replacement: 0.25
      delivery: 0.25
    spec_words: []
    spec_synonyms: {}

# ---------------------------------------------------------------------------
# Stage 2 — stated-priority phrase → weight mapping
# ---------------------------------------------------------------------------
# LLM extracts which phrase the user used for a given criterion (Stage 1);
# Python looks up the numeric weight here. The LLM never invents or computes
# the number itself.
#
# does_not_matter is 0.00 ON PURPOSE, and it is the only weight here that may be
# zero. Without it there is no way for a buyer to say "I don't care about price"
# — the weakest label we had was nice_to_have (0.15), which on most categories is
# still a DOWN-weight of something they explicitly dismissed rather than a
# removal of it. Worse, the offline parser used to read "don't care about price"
# as price *mattering*, because the words "care about" appear inside it.
#
# A zero weight is honest: it means this criterion contributed nothing to the
# ranking, and the approval screen says exactly that. It is not the same as an
# unstated criterion, which gets the documented category default instead.
priority_phrase_weights:
  matters_a_lot: 0.45
  matters: 0.30
  nice_to_have: 0.15
  does_not_matter: 0.00

# ---------------------------------------------------------------------------
# Stage 2 — weight rounding step
# ---------------------------------------------------------------------------
# After a stated priority is substituted in, the remaining criteria are
# rescaled proportionally and then ROUNDED to the nearest multiple of this
# step. Both halves matter and the rounding is not cosmetic:
#
#   packaging defaults 0.25/0.30/0.25/0.20, user says reliability matters a lot
#   -> substitute reliability 0.45, leaving a 0.55 budget
#   -> rescale proportionally: price 0.2200, replacement 0.1833, delivery 0.1467
#   -> round to 0.05:          price 0.20,   replacement 0.20,   delivery 0.15
#
# That rounded set is the one in our deck and in the golden ranking test. The
# unrounded set would produce different scores, so if you change this number the
# 58.0 / 48.7 / 33.7 test will go red — which is exactly what it is for.
#
# Why round at all: a weight is a judgement about what someone cares about.
# Showing an approver "replacement: 0.1833" claims a precision we do not have.
# Multiples of 5% are a number a human can argue with.
weight_rounding_step: 0.05

# ---------------------------------------------------------------------------
# Stage 4.5 - market signal thresholds
# ---------------------------------------------------------------------------
# Stage 4.5 reads each product's price and stock history and says whether NOW is
# a good time to order it. It is ADVISORY and nothing else. Read CLAUDE.md,
# "urgency changes priority, never authority": a signal computed from these
# numbers may never move a product past a hard gate, add a point of score,
# reorder the ranking, or justify spending above authorisation_limit_inr.
#
# They live here for the same reason every other limit does - so no phrasing in a
# user's brief can move them, and so a judge can see the number that produced the
# words on screen. The LLM never sees this block.
market_signal:

  # Stock cover, in days, at the observed depletion rate. The question each one
  # answers is "how long until this vendor no longer has enough for MY order?" -
  # not "until they hit zero", which would flatter a big catalog.
  act_now_cover_days: 3        # at or under this -> "order today"
  order_soon_cover_days: 7     # at or under this -> "order this week"

  # How much a price has to move across the observed window before we call it a
  # trend rather than noise. Percent, applied in both directions. Set it too low
  # and every product looks urgent, which is the same as none of them being.
  material_price_move_pct: 3.0

# ---------------------------------------------------------------------------
# Stages 0-2 — the language step
# ---------------------------------------------------------------------------
# The ONLY part of this file that concerns an LLM, and note what is here: a
# model name and a switch. No limits, no weights, no thresholds. The language
# model is never told what our authorisation limit is, so no phrasing inside a
# user's brief can talk it past one. See CLAUDE.md, "THE ONE RULE".
#
# model: verified working 2026-08-21. gemini-2.5-flash is NOT usable — Google
#   returns 404 for new API keys and directs callers to the 3.x line.
#
#   We were on gemini-3.6-flash and spent whole afternoons in offline mode. The
#   cause, read off the 429 body rather than guessed: the free tier gives that
#   model 20 requests A DAY (quotaId GenerateRequestsPerDayPerProjectPerModel-
#   FreeTier). Reading one brief costs two calls — the scope check and the
#   extraction — so twenty a day is ten briefs, across development, rehearsal
#   and the demo combined.
#
#   The quota is per MODEL, so the lite line is a separate allowance and a much
#   larger one. Google no longer publishes the per-model table (it is account
#   specific in AI Studio), so treat the exact number as unknown and the
#   fallback as the real safety net. The task here is schema-constrained
#   extraction at temperature 0, which is what a lite model is for.
#
# allow_offline_fallback: if Gemini is unreachable or out of quota,
#   agent/language.py switches to a deterministic word-matching parser so a demo
#   cannot die mid-run. The UI labels this plainly — we degrade honestly, we
#   never fake a model call.
#
# use_model: which position the app's "use AI to read my request" switch starts
#   in. A different question from allow_offline_fallback, which only says what to
#   do when a call FAILS; this says whether we mean to make one.
#
#   Set it false and a session begins with the word-matching parser, so no
#   request leaves the machine and the daily free-tier allowance is untouched —
#   which is what a rehearsal run wants. Leave it true and the demo opens showing
#   a real model call. Either way the switch in the sidebar moves it, because
#   this is a default and not a lock.
#
#   Nothing downstream can tell the difference: both parsers hand back the same
#   _Extraction and go through the same _to_brief(). What changes is only who
#   read the sentence, and the UI always says which one did.
llm:
  provider: gemini
  model: gemini-3.5-flash-lite
  allow_offline_fallback: true
  use_model: true

# ---------------------------------------------------------------------------
# Stages 6-7 — mock service failure injection
# ---------------------------------------------------------------------------
# Switches for the pretend vendor and pretend payment gateway. These exist so a
# judge can watch the escalation path fire on demand instead of taking our word
# for it. Flipped live from the Streamlit sidebar during the demo.
#
# The defaults below ARE the scripted demo: confirmation succeeds, then the
# first payment attempt is declined so stage 7's retry is visible on screen.
demo_failure_injection:
  out_of_stock_at_confirmation: false
  price_drift_at_confirmation: false
  decline_first_payment_attempt: true
  # A genuinely dead card: both attempts fail, so stage 7 stops retrying and uses
  # the escalation path instead. OFF by default — it is the switch that makes
  # trigger 3 visible at stage 7, not part of the scripted run.
  decline_every_payment_attempt: false
